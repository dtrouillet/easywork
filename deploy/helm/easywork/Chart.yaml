apiVersion: v2
name: easywork
description: >-
  easywork — enterprise document management system (DMS). Deploys doc-service,
  ingest-worker, search-service and the frontend as independent Deployments,
  plus optional Postgres/RabbitMQ/MinIO/Meilisearch/Keycloak dependencies.
type: application
# Chart version — bumped independently of the application release.
version: 0.1.0
# App version — the default image tag every component falls back to when its
# own `image.tag`/`image.digest` is unset (see _helpers.tpl's
# easywork.imageRef). Must match an actual tag published by
# .github/workflows/release.yml (i.e. a real `vX.Y.Z` git tag) — bump this by
# hand every time a new release tag is pushed, or `helm install` with no
# explicit image override will try to pull a tag that doesn't exist.
appVersion: "v0.0.1"
kubeVersion: ">=1.26.0-0"
home: https://github.com/dtrouillet/easywork
sources:
  - https://github.com/dtrouillet/easywork
keywords:
  - document-management
  - dms
  - spring-boot
  - nextjs
maintainers:
  - name: easywork maintainers
dependencies:
  # NOTE on dependency choices — see values.yaml comments and README.md for the
  # full rationale. Summary: Bitnami's free `rabbitmq`/`minio` charts now point
  # at a frozen, unpatched `bitnamilegacy` image namespace, and `bitnamipostgresql`
  # no longer publishes semver image tags at all. CloudPirates (an active
  # community response to Bitnami's changes) republishes all three on real,
  # pinned, official upstream images (Docker Library postgres/rabbitmq; a
  # digest-pinned rebuild of MinIO's last pre-archival release, since MinIO
  # Inc. itself archived the open-source project). Re-verify these versions
  # with `helm show chart oci://registry-1.docker.io/cloudpirates/<name>`
  # before bumping — this vendor ships new chart versions frequently.
  - name: postgres
    alias: postgresql
    version: "0.19.12"
    repository: "oci://registry-1.docker.io/cloudpirates"
    condition: postgresql.enabled
  - name: rabbitmq
    version: "0.21.12"
    repository: "oci://registry-1.docker.io/cloudpirates"
    condition: rabbitmq.enabled
  - name: minio
    version: "0.13.1"
    repository: "oci://registry-1.docker.io/cloudpirates"
    condition: minio.enabled
  # Meilisearch's own official chart — unaffected by the Bitnami/MinIO
  # situation above, actively maintained, real pinned image tags.
  - name: meilisearch
    version: "0.36.0"
    repository: "https://meilisearch.github.io/meilisearch-kubernetes"
    condition: meilisearch.enabled
  # Optional bundled Keycloak (see docs/adr/0006-optional-bundled-keycloak-identity-provider.md).
  # Disabled by default — SME/enterprise deployments bring their own IdP
  # (oauth2.jwtIssuerUri / app.keycloak*). values-family.yaml enables it for a
  # zero-config first login. Same CloudPirates vendor/versioning caveat as
  # postgres/rabbitmq/minio above.
  - name: keycloak
    version: "0.21.19"
    repository: "oci://registry-1.docker.io/cloudpirates"
    condition: keycloak.enabled
