## Family tier overlay — single replica, minimal resources, zero-config
## simplicity. Use with: helm install ... -f values-family.yaml
## Every field below overrides the corresponding one in values.yaml; anything
## not mentioned here keeps its values.yaml default.

docService:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false

ingestWorker:
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false

searchService:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podDisruptionBudget:
    enabled: false

frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  podDisruptionBudget:
    enabled: false

postgresql:
  replicaCount: 1
  replication:
    enabled: false
  persistence:
    size: 5Gi

rabbitmq:
  replicaCount: 1
  peerDiscoveryK8sPlugin:
    enabled: false
  pdb:
    create: false
  persistence:
    size: 5Gi

minio:
  persistence:
    size: 10Gi

meilisearch:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 5Gi

# Family users have no existing corporate IdP to bring — bundle Keycloak so
# `helm install -f values-family.yaml` gives a fully working login with
# nothing external required. Still needs keycloak.keycloak.hostname,
# keycloak.ingress.hosts[0].host and keycloak.ingress.tls[0].hosts set to a
# real, resolvable hostname (see values.yaml and NOTES.txt).
keycloak:
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 750m
      memory: 768Mi
  postgres:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    persistence:
      size: 2Gi
