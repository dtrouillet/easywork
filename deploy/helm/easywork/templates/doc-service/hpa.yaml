{{- if .Values.docService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "easywork.fullname" . }}-doc-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.componentLabels" (dict "root" . "component" "doc-service") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "easywork.fullname" . }}-doc-service
  minReplicas: {{ .Values.docService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.docService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.docService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
