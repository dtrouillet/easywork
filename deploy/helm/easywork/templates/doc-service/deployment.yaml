apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "easywork.fullname" . }}-doc-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.componentLabels" (dict "root" . "component" "doc-service") | nindent 4 }}
spec:
  {{- if not .Values.docService.autoscaling.enabled }}
  replicas: {{ .Values.docService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "easywork.selectorLabels" (dict "root" . "component" "doc-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "easywork.componentLabels" (dict "root" . "component" "doc-service") | nindent 8 }}
        {{- with .Values.docService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.docService.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "easywork.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.docService.podSecurityContext | nindent 8 }}
      containers:
        - name: doc-service
          image: {{ include "easywork.imageRef" (dict "root" $ "image" .Values.docService.image) }}
          imagePullPolicy: {{ .Values.docService.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.docService.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.docService.springProfilesActive | quote }}
            {{- include "easywork.backendCommonEnv" . | nindent 12 }}
            {{- with .Values.docService.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.docService.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.docService.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.docService.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.docService.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.docService.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.docService.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.docService.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.docService.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.docService.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.docService.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.docService.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.docService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
