{{- if .Values.searchService.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "easywork.fullname" . }}-search-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.componentLabels" (dict "root" . "component" "search-service") | nindent 4 }}
spec:
  type: {{ .Values.searchService.service.type }}
  ports:
    - port: {{ .Values.searchService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "easywork.selectorLabels" (dict "root" . "component" "search-service") | nindent 4 }}
{{- end }}
