{{/*
external-secrets.io ExternalSecret variant of templates/secret.yaml — same
target Secret names/keys, sourced from an external store (Vault/AWS SM/etc.)
instead of rendered inline. Requires the external-secrets operator and the
referenced SecretStore/ClusterSecretStore to already exist in the cluster.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- if .Values.postgresql.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "postgres") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.backend.kind }}
    name: {{ .Values.externalSecrets.backend.name }}
  target:
    name: {{ include "easywork.secretName" (dict "root" . "domain" "postgres") }}
  data:
    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.externalSecrets.paths.postgres }}
        property: password
---
{{- end }}
{{- if .Values.rabbitmq.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "rabbitmq") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.backend.kind }}
    name: {{ .Values.externalSecrets.backend.name }}
  target:
    name: {{ include "easywork.secretName" (dict "root" . "domain" "rabbitmq") }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.paths.rabbitmq }}
        property: password
    - secretKey: erlang-cookie
      remoteRef:
        key: {{ .Values.externalSecrets.paths.rabbitmq }}
        property: erlang-cookie
---
{{- end }}
