  secretStoreRef:
    kind: {{ .Values.externalSecrets.backend.kind }}
    name: {{ .Values.externalSecrets.backend.name }}
  target:
    name: {{ include "easywork.secretName" (dict "root" . "domain" "keycloak-admin") }}
  data:
