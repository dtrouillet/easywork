apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "keycloak-db") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.backend.kind }}
    name: {{ .Values.externalSecrets.backend.name }}
  target:
    name: {{ include "easywork.secretName" (dict "root" . "domain" "keycloak-db") }}
  data:
    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.externalSecrets.paths.keycloak }}
        property: dbPassword
---
# The operator is expected to pre-build the ENTIRE realm.json themselves and
# store it as one property (no `tpl`-style computation is available on this
# path) — its client secret must match whatever is also stored under
# externalSecrets.paths.app's keycloakClientSecret property.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "keycloak-realm") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.backend.kind }}
    name: {{ .Values.externalSecrets.backend.name }}
  target:
    name: {{ include "easywork.secretName" (dict "root" . "domain" "keycloak-realm") }}
  data:
    - secretKey: realm.json
      remoteRef:
        key: {{ .Values.externalSecrets.paths.keycloak }}
        property: realmJson
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "app") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.backend.kind }}
    name: {{ .Values.externalSecrets.backend.name }}
  target:
    name: {{ include "easywork.secretName" (dict "root" . "domain" "app") }}
  data:
    - secretKey: nextauth-secret
      remoteRef:
        key: {{ .Values.externalSecrets.paths.app }}
        property: nextAuthSecret
    - secretKey: keycloak-client-secret
      remoteRef:
        key: {{ .Values.externalSecrets.paths.app }}
        property: keycloakClientSecret
{{- end }}
