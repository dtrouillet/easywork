{{/*
Plain Kubernetes Secrets, one per credential domain — rendered only when
neither externalSecrets.enabled nor secrets.existingSecret is set (see
templates/external-secret.yaml for the other path). Every value is required()
so `helm install` fails loudly instead of deploying with blank credentials.
*/}}
{{- if and (not .Values.externalSecrets.enabled) (not .Values.secrets.existingSecret) }}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "postgres") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "postgresql.auth.password is required (or set externalSecrets.enabled / secrets.existingSecret)" .Values.postgresql.auth.password | quote }}
---
{{- end }}
{{- if .Values.rabbitmq.enabled }}
{{/*
The erlang cookie must stay stable across `helm upgrade` runs — nodes with a
mismatched cookie reject each other and the cluster splits. `helm.sh/resource-
policy: keep` only stops it being deleted on uninstall; it does nothing on
upgrade, so the value itself must be looked up and reused (falling back to a
fresh random one only on first install, when no Secret exists yet).
*/}}
{{- $existingRabbitmqSecret := lookup "v1" "Secret" .Release.Namespace (include "easywork.secretName" (dict "root" . "domain" "rabbitmq")) }}
{{- $erlangCookie := randAlphaNum 32 }}
{{- if $existingRabbitmqSecret }}
{{- $erlangCookie = index $existingRabbitmqSecret.data "erlang-cookie" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "rabbitmq") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
  annotations:
    # The rabbitmq chart itself sets this so re-installs don't rotate the
    # erlang cookie under a running cluster — match that behavior here too.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ required "rabbitmq.auth.password is required (or set externalSecrets.enabled / secrets.existingSecret)" .Values.rabbitmq.auth.password | quote }}
  erlang-cookie: {{ $erlangCookie | quote }}
---
{{- end }}
{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "minio") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
type: Opaque
stringData:
  user: {{ .Values.minio.auth.rootUser | quote }}
  password: {{ required "minio.auth.rootPassword is required (or set externalSecrets.enabled / secrets.existingSecret)" .Values.minio.auth.rootPassword | quote }}
---
{{- end }}
{{- if .Values.meilisearch.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "meilisearch") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
type: Opaque
stringData:
  MEILI_MASTER_KEY: {{ required "meilisearch.auth.masterKey is required (or set externalSecrets.enabled / secrets.existingSecret)" .Values.meilisearch.auth.masterKey | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "app") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
type: Opaque
stringData:
  nextauth-secret: {{ required "app.nextAuthSecret is required (or set externalSecrets.enabled / secrets.existingSecret)" .Values.app.nextAuthSecret | quote }}
  keycloak-client-secret: {{ required "app.keycloakClientSecret is required (or set externalSecrets.enabled / secrets.existingSecret)" .Values.app.keycloakClientSecret | quote }}
{{- end }}
