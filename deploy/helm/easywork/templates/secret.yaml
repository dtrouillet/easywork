{{/*
Plain Kubernetes Secrets, one per credential domain — rendered only when
neither externalSecrets.enabled nor secrets.existingSecret is set (see
templates/external-secret.yaml for the other path).

Every password below is auto-generated (lookup-and-reuse-on-upgrade, same
pattern as the RabbitMQ erlang cookie and Keycloak's own secrets further
down) when left blank, and used verbatim when you DO set one explicitly.
This is deliberate, not just a convenience: Postgres/RabbitMQ only apply
auth.password/auth.rootPassword-equivalents at first boot (when their data
directory is empty) — a bare `required()` with no persistence meant every
`helm upgrade` invocation that regenerated a fresh random value (e.g. via
`--set postgresql.auth.password="$(openssl rand ...)"`, exactly as this
chart's own README used to suggest) would desync the Secret from what the
already-running database/broker actually has, breaking authentication
without ever touching the app's own config. Auto-generate-and-persist avoids
that footgun entirely while still letting you pin an explicit value.
*/}}
{{- if and (not .Values.externalSecrets.enabled) (not .Values.secrets.existingSecret) }}
{{- if .Values.postgresql.enabled }}
{{- $existingPgSecret := lookup "v1" "Secret" .Release.Namespace (include "easywork.secretName" (dict "root" . "domain" "postgres")) }}
{{- $pgPassword := .Values.postgresql.auth.password }}
{{- if not $pgPassword }}
{{- if $existingPgSecret }}
{{- $pgPassword = index $existingPgSecret.data "postgres-password" | b64dec }}
{{- else }}
{{- $pgPassword = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "postgres") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ $pgPassword | quote }}
---
{{- end }}
{{- if .Values.rabbitmq.enabled }}
{{/*
The erlang cookie must stay stable across `helm upgrade` runs — nodes with a
mismatched cookie reject each other and the cluster splits. `helm.sh/resource-
policy: keep` only stops it being deleted on uninstall; it does nothing on
upgrade, so the value itself must be looked up and reused (falling back to a
fresh random one only on first install, when no Secret exists yet). Same
reasoning now applies to the password itself — see the file-level comment.
*/}}
{{- $existingRabbitmqSecret := lookup "v1" "Secret" .Release.Namespace (include "easywork.secretName" (dict "root" . "domain" "rabbitmq")) }}
{{- $erlangCookie := randAlphaNum 32 }}
{{- $rabbitmqPassword := .Values.rabbitmq.auth.password }}
{{- if $existingRabbitmqSecret }}
{{- $erlangCookie = index $existingRabbitmqSecret.data "erlang-cookie" | b64dec }}
{{- if not $rabbitmqPassword }}
{{- $rabbitmqPassword = index $existingRabbitmqSecret.data "password" | b64dec }}
{{- end }}
{{- else if not $rabbitmqPassword }}
{{- $rabbitmqPassword = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "rabbitmq") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
  annotations:
    # The rabbitmq chart itself sets this so re-installs don't rotate the
    # erlang cookie under a running cluster — match that behavior here too.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $rabbitmqPassword | quote }}
  erlang-cookie: {{ $erlangCookie | quote }}
---
{{- end }}
{{- if .Values.minio.enabled }}
{{- $existingMinioSecret := lookup "v1" "Secret" .Release.Namespace (include "easywork.secretName" (dict "root" . "domain" "minio")) }}
{{- $minioPassword := .Values.minio.auth.rootPassword }}
{{- if not $minioPassword }}
{{- if $existingMinioSecret }}
{{- $minioPassword = index $existingMinioSecret.data "password" | b64dec }}
{{- else }}
{{- $minioPassword = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "minio") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  user: {{ .Values.minio.auth.rootUser | quote }}
  password: {{ $minioPassword | quote }}
---
{{- end }}
{{- if .Values.meilisearch.enabled }}
{{- $existingMeiliSecret := lookup "v1" "Secret" .Release.Namespace (include "easywork.secretName" (dict "root" . "domain" "meilisearch")) }}
{{- $meiliMasterKey := .Values.meilisearch.auth.masterKey }}
{{- if not $meiliMasterKey }}
{{- if $existingMeiliSecret }}
{{- $meiliMasterKey = index $existingMeiliSecret.data "MEILI_MASTER_KEY" | b64dec }}
{{- else }}
{{- $meiliMasterKey = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "meilisearch") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MEILI_MASTER_KEY: {{ $meiliMasterKey | quote }}
---
{{- end }}
{{- if .Values.keycloak.enabled }}
{{/*
Admin password and embedded-Postgres password must stay stable across `helm
upgrade` — same reasoning and lookup-and-reuse pattern as the RabbitMQ erlang
cookie above (Keycloak/Postgres reject a rotated credential they weren't
initialized with).
*/}}
{{- $existingKcAdminSecret := lookup "v1" "Secret" .Release.Namespace (include "easywork.secretName" (dict "root" . "domain" "keycloak-admin")) }}
{{- $kcAdminPassword := randAlphaNum 32 }}
{{- if $existingKcAdminSecret }}
{{- $kcAdminPassword = index $existingKcAdminSecret.data "admin-password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "keycloak-admin") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-password: {{ $kcAdminPassword | quote }}
---
{{- $existingKcDbSecret := lookup "v1" "Secret" .Release.Namespace (include "easywork.secretName" (dict "root" . "domain" "keycloak-db")) }}
{{- $kcDbPassword := randAlphaNum 32 }}
{{- if $existingKcDbSecret }}
{{- $kcDbPassword = index $existingKcDbSecret.data "postgres-password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "keycloak-db") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Only key consumed: with keycloak.postgres.enabled: true, the keycloak
  # chart wires KC_DB_USERNAME/KC_DB_PASSWORD straight from
  # keycloak.postgres.auth.* (this Secret), not from keycloak.database.*.
  postgres-password: {{ $kcDbPassword | quote }}
---
{{- end }}
{{/*
$keycloakClientSecret is declared with `:=` here, unconditionally, so it stays
in scope for the rest of this file. When keycloak.enabled and no explicit
app.keycloakClientSecret was set, it's reassigned with `=` (never `:=` inside
the `if` below — that would rescope it to the block and the outer variable
would stay unset) via the same lookup-and-reuse-on-upgrade pattern, so the
SAME value ends up in both this file's `app` Secret AND the realm-import
Secret rendered further down — lookup/randAlphaNum are not memoized across
separate template files, so both objects must come from this one file.
*/}}
{{- $existingAppSecret := lookup "v1" "Secret" .Release.Namespace (include "easywork.secretName" (dict "root" . "domain" "app")) }}
{{- $nextAuthSecret := .Values.app.nextAuthSecret }}
{{- if not $nextAuthSecret }}
{{- if $existingAppSecret }}
{{- $nextAuthSecret = index $existingAppSecret.data "nextauth-secret" | b64dec }}
{{- else }}
{{- $nextAuthSecret = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- $keycloakClientSecret := .Values.app.keycloakClientSecret }}
{{- if and (not $keycloakClientSecret) .Values.keycloak.enabled }}
{{- if $existingAppSecret }}
{{- $keycloakClientSecret = index $existingAppSecret.data "keycloak-client-secret" | b64dec }}
{{- else }}
{{- $keycloakClientSecret = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "app") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  nextauth-secret: {{ $nextAuthSecret | quote }}
  keycloak-client-secret: {{ required "app.keycloakClientSecret is required (or set externalSecrets.enabled / secrets.existingSecret / keycloak.enabled=true)" $keycloakClientSecret | quote }}
{{- if .Values.keycloak.enabled }}
---
{{/*
Realm/client import for the bundled Keycloak — built as Helm dict/list piped
through toJson (not hand-interpolated JSON strings) so no value here needs
manual escaping. Deliberately no `users` array (unlike compose.yml's dev-only
seeded `dev`/`dev` user) — create your first user via the Admin Console/API
after install, per CLAUDE.md's no-hardcoded-credentials rule.
*/}}
{{- $redirectBase := required "frontend.env.nextAuthUrl is required" .Values.frontend.env.nextAuthUrl }}
{{- $realm := dict
      "id" .Values.keycloakRealm.name
      "realm" .Values.keycloakRealm.name
      "displayName" (.Values.keycloakRealm.displayName | default .Values.keycloakRealm.name)
      "enabled" true
      "sslRequired" "external"
      "registrationAllowed" false
      "loginWithEmailAllowed" true
      "duplicateEmailsAllowed" false
      "resetPasswordAllowed" true
      "editUsernameAllowed" false
      "bruteForceProtected" true
      "clients" (list (dict
          "clientId" .Values.app.keycloakClientId
          "name" "easywork Frontend"
          "description" "Next.js frontend"
          "enabled" true
          "clientAuthenticatorType" "client-secret"
          "secret" $keycloakClientSecret
          "publicClient" false
          "bearerOnly" false
          "standardFlowEnabled" true
          "implicitFlowEnabled" false
          "directAccessGrantsEnabled" false
          "serviceAccountsEnabled" false
          "redirectUris" (list (printf "%s/*" $redirectBase))
          "webOrigins" (list $redirectBase)
          "attributes" (dict "post.logout.redirect.uris" (printf "%s/*" $redirectBase))
          "protocol" "openid-connect"
          "fullScopeAllowed" true
          "defaultClientScopes" (list "web-origins" "acr" "roles" "profile" "basic" "email")
          "optionalClientScopes" (list "address" "phone" "offline_access" "microprofile-jwt")
      ))
}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easywork.secretName" (dict "root" . "domain" "keycloak-realm") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
type: Opaque
stringData:
  realm.json: {{ toJson $realm | quote }}
{{- end }}
{{- end }}
