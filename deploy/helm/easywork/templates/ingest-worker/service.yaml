{{/*
No inbound application traffic (queue consumer only) — this Service exists
purely so /actuator/prometheus has a stable ClusterIP scrape target. Set
ingestWorker.service.enabled=false for strict "no Service" ingest-worker.
*/}}
{{- if .Values.ingestWorker.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "easywork.fullname" . }}-ingest-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.componentLabels" (dict "root" . "component" "ingest-worker") | nindent 4 }}
spec:
  type: {{ .Values.ingestWorker.service.type }}
  ports:
    - port: {{ .Values.ingestWorker.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "easywork.selectorLabels" (dict "root" . "component" "ingest-worker") | nindent 4 }}
{{- end }}
