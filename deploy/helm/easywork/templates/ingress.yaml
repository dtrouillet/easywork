{{/*
Single Ingress for the whole stack: `/` routes to the frontend, `/api` routes
to doc-service (the only backend component with public-facing REST endpoints
— ingest-worker/search-service are internal-only).
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "easywork.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "easywork.fullname" . }}-doc-service
                port:
                  number: {{ .Values.docService.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "easywork.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
