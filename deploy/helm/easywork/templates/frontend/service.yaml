apiVersion: v1
kind: Service
metadata:
  name: {{ include "easywork.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "easywork.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "easywork.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
