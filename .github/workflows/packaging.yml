name: Packaging

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/packaging.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-package:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Tests already ran in tests.yml — packaging only validates that the
      # artifact and Docker images build correctly.
      - name: Package jar
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: easywork-jar
          path: backend/target/*.jar

      - uses: docker/setup-buildx-action@v3

      # Build-only validation — no registry push, no credentials required.
      - name: Build runtime image (no OCR)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: false
          load: true
          tags: easywork-backend:runtime-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime-ocr image (ingest profile)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime-ocr
          push: false
          load: true
          tags: easywork-backend:runtime-ocr-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-package:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
