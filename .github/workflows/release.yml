name: Release

# Tag-driven release: pushing a vX.Y.Z tag builds and publishes every
# container image for that commit to GHCR, then cuts a GitHub Release.
# Runs independently of tests.yml/quality.yml — those already gated the
# commit before it was tagged, so this workflow only re-validates that the
# images build, it doesn't re-run the test suite.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same image name for both targets, distinguished by tag suffix — matches
      # deploy/helm/easywork/values.yaml, where docService/searchService and
      # ingestWorker already share `repository: .../easywork-backend` and only
      # differ by `tag`.
      - name: Build & push runtime image (doc-service / search-service)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/easywork-backend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/easywork-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push runtime-ocr image (ingest-worker)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime-ocr
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/easywork-backend:${{ github.ref_name }}-ocr
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/easywork-backend:latest-ocr
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/easywork-frontend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/easywork-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [backend-image, frontend-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Images

            - `ghcr.io/${{ env.IMAGE_OWNER }}/easywork-backend:${{ github.ref_name }}` (doc-service / search-service)
            - `ghcr.io/${{ env.IMAGE_OWNER }}/easywork-backend:${{ github.ref_name }}-ocr` (ingest-worker)
            - `ghcr.io/${{ env.IMAGE_OWNER }}/easywork-frontend:${{ github.ref_name }}`
