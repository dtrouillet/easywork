spring:
  datasource:
    url: jdbc:h2:mem:easywork;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/easywork
  rabbitmq:
    host: localhost
    port: 5672

easywork:
  cors:
    allowed-origins: http://localhost:3000
  storage:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: easywork-documents
  upload:
    max-file-size-bytes: 104857600
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/tiff
      - image/webp
      - text/plain
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/vnd.oasis.opendocument.text
  search:
    host: http://localhost:7700
    api-key: masterKey
  ingest:
    # See application.yml / backend/Dockerfile comment on this path.
    tessdata-path: /usr/share/tesseract-ocr/4.00/tessdata
    ocr-languages: fra+eng

logging:
  level:
    fr.easywork: DEBUG
    org.springframework.security: DEBUG
