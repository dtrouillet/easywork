spring:
  datasource:
    url: jdbc:h2:mem:easywork;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri avoids eager Keycloak contact at startup (lazy resolution)
          jwk-set-uri: http://localhost:8180/realms/easywork/protocol/openid-connect/certs
  rabbitmq:
    host: localhost
    port: 5672

easywork:
  cors:
    allowed-origins: http://localhost:3000
  storage:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: easywork-documents
  search:
    host: http://localhost:7700
    api-key: masterKey
  ingest:
    tessdata-path: /usr/share/tessdata
    ocr-languages: fra+eng

logging:
  level:
    fr.easywork: DEBUG
    org.springframework.security: DEBUG
