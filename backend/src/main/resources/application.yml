spring:
  application:
    name: easywork
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
  servlet:
    multipart:
      max-file-size: 105MB
      max-request-size: 110MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: '{"timestamp":"%d","level":"%p","logger":"%logger","message":"%m"}%n'
  level:
    fr.easywork: INFO

easywork:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
  upload:
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:104857600}
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/tiff
      - image/webp
      - text/plain
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/vnd.oasis.opendocument.text
  search:
    host: ${MEILISEARCH_HOST}
    api-key: ${MEILISEARCH_API_KEY}
  ingest:
    tessdata-path: ${TESSDATA_PATH:/usr/share/tessdata}
    ocr-languages: ${OCR_LANGUAGES:fra+eng}
