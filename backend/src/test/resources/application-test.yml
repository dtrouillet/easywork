spring:
  datasource:
    url: jdbc:h2:mem:easywork_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/realms/test

easywork:
  cors:
    allowed-origins: http://localhost:3000
  storage:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: easywork-test
  search:
    host: http://localhost:7700
    api-key: masterKey
  ingest:
    tessdata-path: /usr/share/tessdata
    ocr-languages: fra+eng

logging:
  level:
    fr.easywork: WARN
