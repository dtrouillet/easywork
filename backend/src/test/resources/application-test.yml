spring:
  datasource:
    url: jdbc:h2:mem:easywork_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/realms/test

easywork:
  cors:
    allowed-origins: http://localhost:3000
  storage:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: easywork-test
  upload:
    max-file-size-bytes: 104857600
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/tiff
      - image/webp
      - text/plain
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/vnd.oasis.opendocument.text
  search:
    host: http://localhost:7700
    api-key: masterKey
  ingest:
    tessdata-path: /usr/share/tessdata
    ocr-languages: fra+eng
  rabbit:
    document-uploaded-exchange: easywork.document.uploaded
    document-uploaded-queue: easywork.document.uploaded.ingest
    ingest-completed-exchange: easywork.ingest.completed
    ingest-completed-queue: easywork.ingest.completed.document

logging:
  level:
    fr.easywork: WARN
